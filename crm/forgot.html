<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · 3PSolutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <style>
    :root{ --navy:#0A2540; --blue:#1B6EF3; --green:#16A34A; --red:#E5484D;
      --text:#1A1F36; --muted:#6B7280; --border:#E5E9F0; --surface-2:#F6F8FB; }
    *{box-sizing:border-box;} html,body{margin:0;min-height:100%;}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:var(--text);
      -webkit-font-smoothing:antialiased; min-height:100vh; display:grid; place-items:center; padding:32px;
      background:radial-gradient(125% 120% at 0% 0%, #16467a 0%, #0f3358 45%, var(--navy) 100%);}
    .card{width:100%; max-width:420px; background:#fff; border-radius:18px; padding:34px 32px; box-shadow:0 30px 70px rgba(0,0,0,.32);}
    .brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
    .brand img{width:44px;height:44px;border-radius:12px;background:#fff;padding:4px;box-shadow:0 6px 16px rgba(10,37,64,.18);}
    .brand b{font-size:16px;} .brand span{display:block;font-size:12px;color:var(--muted);}
    h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.4px;}
    .lead{margin:0 0 22px;color:var(--muted);font-size:14px;}
    label{display:block;font-size:13px;font-weight:600;margin:0 0 7px;}
    input{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--text);
      border:1px solid var(--border);border-radius:11px;background:var(--surface-2);outline:none;}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,110,243,.15);background:#fff;}
    .btn{width:100%;border:none;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#0c2c4d,var(--navy));
      color:#fff;font-weight:700;font-size:14.5px;padding:14px;border-radius:11px;margin-top:18px;}
    .btn:hover{transform:translateY(-1px);} .btn:disabled{opacity:.6;transform:none;cursor:default;}
    .msg{display:none;padding:11px 13px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:6px;}
    .msg.ok{display:block;background:#E7F6ED;color:var(--green);border:1px solid #bfe6cc;}
    .msg.err{display:block;background:#FCEBEC;color:var(--red);border:1px solid #f6c9cb;}
    .links{margin-top:20px;font-size:13px;color:var(--muted);text-align:center;line-height:1.7;}
    .links a{color:var(--blue);font-weight:600;text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/logo.png" alt="3PSolutions" />
      <div><b>3PSolutions</b><span>Merchant CRM</span></div>
    </div>
    <h2>Reset your password</h2>
    <p class="lead">Enter your account email and we'll send you a link to set a new password.</p>

    <div class="msg" id="msg"></div>

    <form id="forgotForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@company.com" required autofocus />
      <button class="btn" type="submit" id="submitBtn">Send reset link</button>
    </form>

    <div class="links">
      <a href="/login">← Back to sign in</a><br>
      Still stuck? <a href="https://t.me/use3psolutions" target="_blank" rel="noopener noreferrer">Message us on Telegram</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        await fetch('/api/forgot', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }) });
      } catch (_) {}
      msg.className = 'msg ok';
      msg.textContent = "If an account exists for that email, a reset link is on its way. Check your inbox.";
      form.style.display = 'none';
    });
  </script>
</body>
</html>
